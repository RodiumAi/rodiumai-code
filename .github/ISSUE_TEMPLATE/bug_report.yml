name: Bug report
description: Something does not work as it should in a RodiumAi product
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Please read [CONTRIBUTING.md](https://github.com/RodiumAi/rodiumai-code/blob/main/CONTRIBUTING.md) first.

        **This issue is public. Remove API keys (`rd_sk_...`), tokens, passwords and personal data from everything you paste.**
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - RodiumAi Code CLI
        - RodiumAi Code Desktop
        - RodiumAi Code for VS Code and Cursor
        - RodiumAi MCP server
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Product version
      description: "CLI: run `rodium --version`. Extension: shown in the Extensions view of your editor. Desktop app and MCP server: the version you installed."
      placeholder: "1.0.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: System details
      description: Operating system version and processor type, and the editor and its version for the extension.
      placeholder: "Windows 11 x64, or macOS 15 on Apple Silicon, or Ubuntu 24.04 ARM64"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem. Paste the exact error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step, so that we can do the same.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or command output
      description: The product-specific guides in this repository say which logs help. Remove secrets and personal data first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues and did not find this problem.
          required: true
        - label: I removed API keys, tokens, passwords and personal data from this issue.
          required: true
